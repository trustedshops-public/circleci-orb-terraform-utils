description: >
  Install terrastate

parameters:
  version:
    type: string
    description: Version of terrastate to install
    # renovate: datasource=github-releases depName=janritter/terrastate
    default: 2.2.2

steps:
  - run:
      name: Install terrastate
      environment:
        TERRASTATE_PARAM_VERSION: <<parameters.version>>
      command: <<include(scripts/install_terrastate.sh)>>
