description: >
  Install tfenv

parameters:
  version:
    type: string
    description: Version of tfenv to install
    # renovate: datasource=github-releases depName=tfutils/tfenv
    default: v3.2.2

steps:
  - run:
      name: Install tfenv
      environment:
        TFENV_PARAM_VERSION: <<parameters.version>>
      command: <<include(scripts/install_tfenv.sh)>>
