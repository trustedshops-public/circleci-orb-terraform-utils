description: >
  Install all required terraform tools in a single command

parameters:
  tfenv_version:
    description: Version of the tfenv to install
    default: none
    type: string
  terrastate_version:
    description: Version of terrastate to install
    default: none
    type: string
  terraform_version:
    description: Verion of terraform to install
    default: none
    type: string
  terraform_docs_version:
    description: Version of terraform-docs to install. Default "none" skips installation.
    default: none
    type: string
  tflint_version:
    description: Version of tflint to install. Default "none" skips installation.
    default: none
    type: string

steps:
  - unless:
      condition:
        and:
          - equal: [<<parameters.tfenv_version>>, "none"]
      steps:
        - install_tfenv:
            version: <<parameters.tfenv_version>>
  - unless:
      condition:
        and:
          - equal: [<<parameters.terrastate_version>>, "none"]
      steps:
        - install_terrastate:
            version: <<parameters.terrastate_version>>
  - unless:
      condition:
        and:
          - equal: [<<parameters.terraform_version>>, "none"]
      steps:
        - install_terraform:
            version: <<parameters.terraform_version>>
  - unless:
      condition:
        and:
          - equal: [<<parameters.terraform_docs_version>>, "none"]
      steps:
        - install_terraform_docs:
            version: <<parameters.terraform_docs_version>>
  - unless:
      condition:
        and:
          - equal: [<<parameters.tflint_version>>, "none"]
      steps:
        - install_tflint:
            version: <<parameters.tflint_version>>
