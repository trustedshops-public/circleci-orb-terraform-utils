description: >
  Restore the terraform providers cache for a module. Keyed on the module's
  .terraform.lock.hcl. The lockfile MUST exist in the module path; the
  caller is responsible for guarding this command behind a feature toggle
  for projects without a lockfile (otherwise CircleCI fails the build at
  cache step evaluation time).

parameters:
  path:
    description: Path to the terraform module containing .terraform.lock.hcl
    default: .
    type: string

steps:
  - restore_cache:
      keys:
        - tf-orb-providers-v1-{{ checksum "<<parameters.path>>/.terraform.lock.hcl" }}
        - tf-orb-providers-v1-
