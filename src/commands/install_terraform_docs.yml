description: >
  Install terraform-docs

parameters:
  version:
    type: string
    description: >
      Version of terraform-docs to install. Use the upstream tag form
      including the v prefix, e.g. "v0.20.0".
    # renovate: datasource=github-releases depName=terraform-docs/terraform-docs
    default: v0.24.0

steps:
  - run:
      name: Install terraform-docs
      environment:
        TERRAFORM_DOCS_PARAM_VERSION: <<parameters.version>>
      command: <<include(scripts/install_terraform_docs.sh)>>
