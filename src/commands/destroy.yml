description: >
  Run terraform destroy in the given module with -auto-approve.

parameters:
  path:
    description: Path to the terraform module
    default: .
    type: string
  var_file:
    description: >
      Variable file to pass via -var-file. When empty (default), the flag is
      omitted entirely.
    default: ''
    type: string
  cli_config_file:
    description: Path to a terraform CLI config file
    default: ''
    type: string

steps:
  - run:
      name: Terraform destroy
      environment:
        TERRAFORM_PARAM_PATH: <<parameters.path>>
        TERRAFORM_PARAM_VAR_FILE: <<parameters.var_file>>
        TERRAFORM_PARAM_CLI_CONFIG_FILE: <<parameters.cli_config_file>>
      command: <<include(scripts/destroy.sh)>>
