description: >
  Install tflint

parameters:
  version:
    type: string
    description: >
      Version of tflint to install. Use the upstream tag form including
      the v prefix, e.g. "v0.62.0".
    # renovate: datasource=github-releases depName=terraform-linters/tflint
    default: v0.64.0

steps:
  - run:
      name: Install tflint
      environment:
        TFLINT_PARAM_VERSION: <<parameters.version>>
      command: <<include(scripts/install_tflint.sh)>>
