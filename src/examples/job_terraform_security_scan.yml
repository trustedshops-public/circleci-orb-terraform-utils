description: Scan terraform modules for security misconfigurations using trivy
usage:
  version: 2.1
  orbs:
    terraform-utils: trustedshops-public/terraform-utils@<version>
  workflows:
    pr_checks:
      jobs:
        - terraform-utils/terraform_security_scan:
            name: security-scan
            trivy_version: v0.70.0
            path: terraform
            severity: "HIGH,CRITICAL"
