description: Tear down a terraform-managed environment on a manual trigger
usage:
  version: 2.1
  orbs:
    terraform-utils: trustedshops-public/terraform-utils@<version>
  workflows:
    teardown:
      jobs:
        - terraform-utils/terraform_destroy:
            name: destroy-dev
            terraform_version: 1.10.5
            path: terraform
            var_file: vars/dev.tfvars
            filters:
              branches:
                only: teardown-dev
