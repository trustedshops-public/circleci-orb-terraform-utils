description: |
  Run terraform fmt as a fast PR gate. Default mode fails the job when files need formatting; flip auto_commit to true to push the fix back automatically.
usage:
  version: 2.1
  orbs:
    terraform-utils: trustedshops-public/terraform-utils@<version>
    github-utils: trustedshops-public/github-utils@1.0.0
  workflows:
    pr_checks:
      jobs:
        - terraform-utils/terraform_fmt:
            name: fmt-check
            terraform_version: 1.10.5
            path: terraform
            auto_commit: true
            git_user_name: "etrusted-bot"
            git_user_email: "32764267+etrusted-bot@users.noreply.github.com"
            pre_commit_steps:
              - github-utils/rewrite_urls_with_token
            context:
              - github-release
